<!doctype html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Алаң</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--gold:#ffcf6e;--ink:#fff7ea;--bg:#17111c;--card:#241a2b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);cursor:none;
  font-family:Manrope,"LG Smart UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#c{position:fixed;left:0;top:0;display:block}

/* басты бет */
#hub{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;padding:6vh 4.5vw 5vh}
#hub.hide{display:none}
.hl{flex:1;display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:flex-end}
.brand h1{font-size:10vh;font-weight:800;line-height:.9;color:var(--gold);letter-spacing:-.02em}
.brand span{font-size:2.8vh;font-weight:700;opacity:.7;margin:0 0 1vh 2vw}
.grid{display:flex;flex-wrap:wrap;margin:3vh -1vw 0}
.card{width:46%;margin:1.4vh 1.5%;height:30vh;border-radius:2.6vh;position:relative;overflow:hidden;background:var(--card);
  transition:transform .15s,box-shadow .15s;box-shadow:0 1.4vh 4vh rgba(0,0,0,.35)}
.card canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:2.2vh 1.8vw 2vh;background:linear-gradient(rgba(12,8,14,0),rgba(12,8,14,.94))}
.card h2{font-size:4.6vh;font-weight:800;line-height:1.05}
.card p{font-size:2.3vh;font-weight:700;opacity:.72;margin-top:.6vh}
.card .bst{position:absolute;right:1.6vw;top:1.8vh;font-size:2vh;font-weight:800;background:rgba(12,8,14,.6);padding:.6vh 1vw;border-radius:4vh}
.card.on{transform:scale(1.04);box-shadow:0 0 0 .7vh var(--gold),0 2vh 6vh rgba(0,0,0,.55)}
.qrbox{width:46vh;margin-left:3vw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#qrimg{width:40vh;height:40vh;background:#fff;border-radius:2.6vh;padding:2.2vh;box-shadow:0 2vh 6vh rgba(0,0,0,.45)}
#qrimg img{width:100%;height:100%;display:block;image-rendering:pixelated}
.qrbox h3{font-size:4vh;font-weight:800;color:var(--gold);margin-top:2.4vh}
.qrbox p{font-size:2.5vh;font-weight:600;opacity:.8;margin-top:1vh;line-height:1.4}
#plink{font-size:2.7vh;font-weight:800;margin-top:1vh;letter-spacing:.01em}
#pcode{font-size:3.2vh;font-weight:800;margin-top:.8vh}
#pcode b{color:var(--gold);letter-spacing:.12em;font-size:4.4vh}
#pst{margin-top:2.4vh;font-size:2.5vh;font-weight:800;padding:1.1vh 2.2vw;border-radius:5vh;background:rgba(255,255,255,.08)}
#pst.ok{background:rgba(120,220,140,.18);color:#9be8ad}
.author{position:fixed;right:4.5vw;bottom:3vh;font-size:1.8vh;font-weight:600;opacity:.38}
.hint{position:fixed;left:4.5vw;bottom:3vh;font-size:2.2vh;font-weight:700;opacity:.55}

/* ойын қабаты */
#gameui{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none}
.back{position:fixed;left:2.6vw;top:2.6vh;font-size:2.7vh;font-weight:800;padding:1.2vh 1.8vw;border-radius:5vh;background:rgba(20,12,24,.62);z-index:5}
.back.on{background:var(--gold);color:#24160c}
.panel{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at center,rgba(20,12,24,.5),rgba(20,12,24,.88));z-index:4}
.panel h1{font-size:13vh;font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--gold);text-shadow:0 .8vh 4vh rgba(0,0,0,.5)}
.panel .sub{font-size:3.6vh;font-weight:700;opacity:.85}
.panel p{font-size:3.3vh;font-weight:600;margin-top:2.4vh;opacity:.88;max-width:72vw;line-height:1.45}
.panel .big{font-size:10vh;font-weight:800;margin-top:1vh}
.panel .btn{margin-top:5vh;font-size:4.2vh;font-weight:800;background:var(--gold);color:#24160c;padding:2.2vh 5.5vw;border-radius:10vh}
.panel .btn.on{background:#fff}
.legend{display:flex;flex-wrap:wrap;justify-content:center;margin-top:3.6vh;font-size:3vh;font-weight:700;max-width:80vw}
.legend span{margin:.6vh 1.8vw}
.legend b{color:var(--gold)}
.legend .bad b{color:#ff7a6b}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:center;padding:2.6vh 4vw 0;pointer-events:none;z-index:3}
.hud div{margin:0 3.4vw;text-align:center;font-size:5.4vh;font-weight:800;text-shadow:0 .4vh 1.6vh rgba(0,0,0,.6)}
.hud small{display:block;font-size:2.1vh;font-weight:800;opacity:.68;letter-spacing:.08em;text-transform:uppercase}
.hud .acc{color:var(--gold)}
#toast{position:fixed;left:50%;top:16vh;transform:translateX(-50%);font-size:4.6vh;font-weight:800;color:var(--gold);
  text-shadow:0 .5vh 2vh rgba(0,0,0,.7);opacity:0;transition:opacity .25s;pointer-events:none;z-index:6;white-space:nowrap}
#cur{position:fixed;left:0;top:0;width:5.2vh;height:5.2vh;margin:-2.6vh 0 0 -2.6vh;border-radius:50%;border:.55vh solid var(--gold);
  box-shadow:0 0 0 .3vh rgba(0,0,0,.35),0 0 2vh rgba(0,0,0,.5);pointer-events:none;z-index:99;display:none}
#cur:after{content:"";position:absolute;left:50%;top:50%;width:.9vh;height:.9vh;margin:-.45vh 0 0 -.45vh;border-radius:50%;background:var(--gold)}
</style></head><body>
<canvas id="c"></canvas>

<div id="hub">
  <div class="hl">
    <div class="brand"><h1>Алаң</h1><span>отбасылық ойындар</span></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="qrbox">
    <div id="qrimg"></div>
    <h3>Телефон — пульт</h3>
    <p>Камерамен сканерлеңіз немесе телефонда ашыңыз:</p>
    <div id="plink"></div>
    <div id="pcode"></div>
    <div id="pst">Дайындалуда…</div>
  </div>
  <div class="hint">OK — ашу · Back — мәзірге · қызыл түйме — дыбыс</div>
  <div class="author">Автор: Айдынбай Нұртілек · 8 702 476 14 49 · github.com/Aydynbai</div>
</div>
<div id="gameui"></div>
<div id="toast"></div>
<div id="cur"></div>

<script src="sound.js"></script>
<script>
/* ===== Алаң платформасы ===== */
var P={games:[],cur:null,mx:0,my:0,W:0,H:0,padOn:false};
(function(){
  var cv=document.getElementById('c');P.ctx=cv.getContext('2d');
  P.size=function(){P.W=cv.width=innerWidth;P.H=cv.height=innerHeight;if(P.cur&&P.cur.resize)P.cur.resize();if(!P.cur&&P.drawCovers)P.drawCovers()};
  addEventListener('resize',P.size);
})();
P.S=window.Sound||{};
['wake','mode','play','stop','dive','hit','miss','wolf','note','tick','win','lose','click','chime'].forEach(function(k){if(!P.S[k])P.S[k]=function(){}});
if(!P.S.isOn)P.S.isOn=function(){return true};if(!P.S.toggle)P.S.toggle=function(){return true};
P.rnd=function(a,b){return a+Math.random()*(b-a)};
P.register=function(g){P.games.push(g)};
P.best=function(id,v){var k='alan_best_'+id;try{if(v!==undefined){localStorage.setItem(k,v);return v}return +localStorage.getItem(k)||0}catch(e){return 0}};
P.esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

/* --- ою-өрнек салу (ортақ) --- */
P.orn=function(c,type,cx,cy,s,col,lw){
  c.save();c.translate(cx,cy);c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw||s*.11;c.lineCap='round';c.lineJoin='round';
  function horn(sd){c.beginPath();c.moveTo(0,s*.42);c.lineTo(0,s*.05);
    c.bezierCurveTo(0,-s*.32,sd*s*.55,-s*.46,sd*s*.55,-s*.08);
    c.bezierCurveTo(sd*s*.55,s*.2,sd*s*.22,s*.16,sd*s*.25,-s*.06);c.stroke()}
  if(type==0){horn(-1);horn(1)}
  else if(type==1){for(var i=0;i<4;i++){c.rotate(Math.PI/2);c.beginPath();c.arc(0,-s*.3,s*.17,Math.PI*.15,Math.PI*1.85,true);c.stroke()}
    c.beginPath();c.moveTo(0,-s*.12);c.lineTo(s*.12,0);c.lineTo(0,s*.12);c.lineTo(-s*.12,0);c.closePath();c.fill()}
  else if(type==2){for(var j=0;j<3;j++){var y=-s*.32+j*s*.26;c.beginPath();c.moveTo(-s*.45,y);c.lineTo(0,y+s*.22);c.lineTo(s*.45,y);c.stroke()}}
  else if(type==3){for(var r=0;r<2;r++){c.save();c.rotate(r*Math.PI/4);c.strokeRect(-s*.3,-s*.3,s*.6,s*.6);c.restore()}
    c.beginPath();c.arc(0,0,s*.09,0,7);c.fill()}
  else if(type==4){c.beginPath();c.moveTo(-s*.48,s*.25);c.lineTo(-s*.24,-s*.2);c.lineTo(0,s*.25);c.lineTo(s*.24,-s*.2);c.lineTo(s*.48,s*.25);c.stroke();
    c.beginPath();c.moveTo(-s*.24,s*.25);c.lineTo(-s*.24,s*.05);c.moveTo(s*.24,s*.25);c.lineTo(s*.24,s*.05);c.stroke()}
  else if(type==5){c.beginPath();c.moveTo(0,s*.45);c.lineTo(0,-s*.05);c.stroke();
    c.beginPath();c.moveTo(0,-s*.05);c.bezierCurveTo(-s*.42,-s*.05,-s*.4,-s*.42,-s*.2,-s*.45);c.bezierCurveTo(-s*.12,-s*.3,-s*.05,-s*.28,0,-s*.42);
    c.bezierCurveTo(s*.05,-s*.28,s*.12,-s*.3,s*.2,-s*.45);c.bezierCurveTo(s*.4,-s*.42,s*.42,-s*.05,0,-s*.05);c.fill();
    c.beginPath();c.moveTo(0,s*.25);c.quadraticCurveTo(-s*.3,s*.2,-s*.32,s*.02);c.moveTo(0,s*.25);c.quadraticCurveTo(s*.3,s*.2,s*.32,s*.02);c.stroke()}
  c.restore();
};

/* --- DOM көмекшілер --- */
P.ui=document.getElementById('gameui');
P.panelCb=null;
P.panel=function(o){
  var old=P.ui.querySelector('.panel');if(old)old.parentNode.removeChild(old);
  P.panelCb=null;if(!o)return;
  var h='';
  if(o.title)h+='<h1>'+P.esc(o.title)+'</h1>';
  if(o.sub)h+='<div class="sub">'+P.esc(o.sub)+'</div>';
  if(o.big!=null)h+='<div class="big">'+P.esc(o.big)+'</div>';
  if(o.text)h+='<p>'+P.esc(o.text)+'</p>';
  if(o.legend){h+='<div class="legend">';o.legend.forEach(function(l){h+='<span'+(l[2]?' class="bad"':'')+'><b>'+P.esc(l[0])+'</b> '+P.esc(l[1])+'</span>'});h+='</div>'}
  h+='<div class="btn" data-act="panel">'+P.esc(o.btn||'OK — бастау')+'</div>';
  var d=document.createElement('div');d.className='panel';d.innerHTML=h;P.ui.appendChild(d);P.panelCb=o.on||null;
};
P.hud=function(items){
  var el=P.ui.querySelector('.hud');
  if(!items){if(el)el.parentNode.removeChild(el);return}
  if(!el){el=document.createElement('div');el.className='hud';P.ui.appendChild(el)}
  var h='';items.forEach(function(it){h+='<div><small>'+P.esc(it[0])+'</small><span'+(it[2]?' class="acc"':'')+'>'+P.esc(it[1])+'</span></div>'});
  el.innerHTML=h;
};
var toastT;P.toast=function(t,ms){var e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(function(){e.style.opacity=0},ms||1400)};
P.vib=function(p){P.padSend({t:'v',p:p})};
P.padSend=function(){};

/* --- басты бет --- */
P.drawCovers=function(){
  var cs=document.querySelectorAll('.card canvas');
  for(var i=0;i<cs.length;i++){var c=cs[i],g=P.games[i];c.width=c.clientWidth;c.height=c.clientHeight;if(g.cover)try{g.cover(c.getContext('2d'),c.width,c.height)}catch(e){}}
  var b=document.querySelectorAll('.card .bst');for(i=0;i<b.length;i++){var v=P.best(P.games[i].id);b[i].textContent=v?'Рекорд: '+v:'';b[i].style.display=v?'block':'none'}
};
P.buildHub=function(){
  var h='';P.games.forEach(function(g){h+='<div class="card" data-act="open:'+g.id+'"><canvas></canvas><span class="bst"></span><div class="cap"><h2>'+P.esc(g.title)+'</h2><p>'+P.esc(g.sub)+'</p></div></div>'});
  document.getElementById('grid').innerHTML=h;P.drawCovers();
};
var hubBg=document.createElement('canvas');
P.bakeHub=function(){
  var W=P.W,H=P.H;hubBg.width=W;hubBg.height=H;var c=hubBg.getContext('2d');
  var g=c.createRadialGradient(W*.3,H*.2,0,W*.5,H*.5,W*.8);g.addColorStop(0,'#2b1d33');g.addColorStop(1,'#120d16');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  var s=H*.12,row=0;for(var y=0;y<H+s;y+=s*1.1,row++)for(var x=(row%2)*s*.55;x<W+s;x+=s*1.1)P.orn(c,0,x,y,s*.8,'rgba(255,207,110,.045)',s*.06);
};
P.home=function(){
  if(P.cur&&P.cur.stop)P.cur.stop();P.cur=null;P.panel(null);P.hud(null);P.ui.innerHTML='';
  document.getElementById('hub').className='';P.S.mode('hub');P.drawCovers();P.padSend({t:'g',name:'Алаң'});
};
P.open=function(id){
  var g=null;P.games.forEach(function(x){if(x.id==id)g=x});if(!g)return;
  document.getElementById('hub').className='hide';P.cur=g;P.ui.innerHTML='<div class="back" data-act="back">← Алаң</div>';
  P.S.mode(g.id);P.S.click();g.start(P);P.padSend({t:'g',name:g.title});
};

/* --- енгізу --- */
var lastAct=0,hoverEl=null,curEl=document.getElementById('cur'),curShown=0;
P.action=function(){
  var now=Date.now();if(now-lastAct<160)return;lastAct=now;P.S.wake();
  var el=document.elementFromPoint(P.mx,P.my),a=el&&el.closest?el.closest('[data-act]'):null;
  if(a){var k=a.getAttribute('data-act');
    if(k=='back'){P.home();return}
    if(k.indexOf('open:')==0){P.open(k.slice(5));return}
    if(k=='panel'&&P.panelCb){P.S.click();P.panelCb();return}}
  if(!P.cur)return;
  if(P.panelCb){P.S.click();P.panelCb();return}
  if(P.cur.onAction)P.cur.onAction(P.mx,P.my);
};
P.back=function(){if(P.cur)P.home()};
function setCur(x,y){P.mx=Math.max(0,Math.min(P.W,x));P.my=Math.max(0,Math.min(P.H,y));curShown=1}
addEventListener('mousemove',function(e){setCur(e.clientX,e.clientY)});
addEventListener('mousedown',function(e){setCur(e.clientX,e.clientY);P.action();e.preventDefault()});
function hubNav(k){
  var cards=document.querySelectorAll('.card');if(!cards.length)return;
  var i=hoverEl?Array.prototype.indexOf.call(cards,hoverEl):-1;
  if(i<0)i=0;else if(k==37)i=Math.max(0,i-1);else if(k==39)i=Math.min(cards.length-1,i+1);else if(k==38)i=Math.max(0,i-2);else if(k==40)i=Math.min(cards.length-1,i+2);
  var r=cards[i].getBoundingClientRect();setCur(r.left+r.width/2,r.top+r.height/2);
}
P.muteToggle=function(){var on=P.S.toggle();P.toast(on?'Дыбыс қосулы':'Дыбыс өшірулі');P.padSend({t:'snd',on:on})};
addEventListener('keydown',function(e){
  var k=e.keyCode;P.S.wake();
  if(k==13){P.action();e.preventDefault();return}
  if(k==461||k==27||k==8){if(P.cur){P.back();e.preventDefault()}return}
  if(k==403||k==77){P.muteToggle();e.preventDefault();return}
  if(P.cur&&P.cur.onKey&&P.cur.onKey(k)){e.preventDefault();return}
  if(!P.cur&&k>=37&&k<=40){hubNav(k);e.preventDefault()}
},true);

/* --- кадр циклі --- */
var lastT=0;
function frame(now){
  var dt=Math.min(.05,(now-(lastT||now))/1000);lastT=now;
  try{if(P.cur)P.cur.frame(dt,now);else P.ctx.drawImage(hubBg,0,0)}catch(e){if(window.console)console.error(e)}
  if(curShown){curEl.style.display='block';curEl.style.transform='translate('+P.mx+'px,'+P.my+'px)';curEl.style.opacity=(P.cur&&P.cur.hideCursor&&!P.panelCb)?0:1}
  var el=document.elementFromPoint(P.mx,P.my),a=el&&el.closest?el.closest('[data-act]'):null;
  if(a!==hoverEl){if(hoverEl)hoverEl.classList.remove('on');if(a)a.classList.add('on');hoverEl=a}
  requestAnimationFrame(frame);
}
</script>

<script src="games/burkit.js"></script>
<script src="games/asyq.js"></script>
<script src="games/oyu.js"></script>
<script src="games/togyz.js"></script>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ===== телефон-пульт ===== */
var padConn=null;
P.padSend=function(o){if(padConn&&padConn.open)try{padConn.send(o)}catch(e){}};
function pst(t,ok){var e=document.getElementById('pst');e.textContent=t;e.className=ok?'ok':''}
function onPad(d){
  if(!d)return;
  if(d.t=='m')setCur(P.mx+d.x*P.W,P.my+d.y*P.H);
  else if(d.t=='a')P.action();
  else if(d.t=='b'){if(P.cur)P.back()}
  else if(d.t=='mute')P.muteToggle();
  else if(d.t=='k'){if(P.cur){if(P.cur.onKey)P.cur.onKey(d.k)}else hubNav(d.k)}
}
function initPad(){
  if(!window.Peer){pst('Интернет байланысын тексеріңіз');return}
  var code=null;try{code=localStorage.getItem('alan_code')}catch(e){}
  if(!code||!/^\d{4}$/.test(code)){code=String(1000+Math.floor(Math.random()*9000));try{localStorage.setItem('alan_code',code)}catch(e){}}
  var id='alantv-'+code;
  var peer=new Peer(id,{debug:0});
  peer.on('open',function(){
    var base=location.href.split('#')[0].split('?')[0].replace(/index\.html$/,'');if(base.slice(-1)!='/')base+='/';
    var url=base+'p/#'+code;window.PADURL=url;
    try{var q=qrcode(0,'M');q.addData(url);q.make();document.getElementById('qrimg').innerHTML=q.createImgTag(8,0)}catch(e){}
    document.getElementById('plink').textContent=(base+'p').replace(/^https?:\/\//,'');
    document.getElementById('pcode').innerHTML='Код: <b>'+code+'</b>';
    if(!padConn)pst('Қосылуды күтуде');
  });
  peer.on('connection',function(c){
    c.on('open',function(){if(padConn&&padConn!==c)try{padConn.close()}catch(e){}
      padConn=c;P.padOn=true;pst('Телефон қосылды ✓',true);P.toast('Телефон қосылды');
      P.padSend({t:'g',name:P.cur?P.cur.title:'Алаң'});P.padSend({t:'snd',on:P.S.isOn()})});
    c.on('data',onPad);
    c.on('close',function(){if(padConn===c){padConn=null;P.padOn=false;pst('Қосылуды күтуде');P.toast('Телефон ажырады')}});
  });
  peer.on('disconnected',function(){setTimeout(function(){try{peer.reconnect()}catch(e){}},1500)});
  peer.on('error',function(e){
    if(e&&e.type=='unavailable-id'){try{localStorage.removeItem('alan_code')}catch(_){}
      try{peer.destroy()}catch(_){}setTimeout(initPad,500);return}
    pst('Қайта қосылуда…');
  });
}

/* ===== іске қосу ===== */
P.size();P.bakeHub();addEventListener('resize',P.bakeHub);
P.buildHub();P.S.mode('hub');
setCur(P.W*.3,P.H*.45);curShown=0;
requestAnimationFrame(frame);
initPad();
</script>
</body></html>
