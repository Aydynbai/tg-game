<!doctype html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1420">
<title>Бүркітші — пульт</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#1b1420;color:#fff7ea;font-family:Manrope,system-ui,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px)}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 14px}
h1{font-size:22px;font-weight:800;color:#ffcf6e}
#mute{background:rgba(255,255,255,.08);border:0;border-radius:20px;font-size:16px;padding:5px 10px;margin-right:6px;color:#fff}
#st{font-size:14px;font-weight:700;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.08);color:rgba(255,247,234,.7)}
#st.ok{background:rgba(120,220,140,.16);color:#8fe3a4}
#pad{flex:1;border-radius:24px;background:radial-gradient(circle at 50% 40%,#3a2740,#241829);position:relative;
  display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.06)}
#pad p{font-size:17px;font-weight:700;color:rgba(255,247,234,.45);line-height:1.5;pointer-events:none}
#dot{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid #ffcf6e;opacity:0;pointer-events:none;transition:opacity .15s}
#go{margin-top:14px;height:120px;border-radius:24px;border:0;background:#ffcf6e;color:#24160c;font:800 30px Manrope,system-ui,sans-serif;letter-spacing:.02em}
#go:active,#go.on{transform:scale(.97);background:#ffbe3b}
#msg{position:fixed;left:0;right:0;top:40%;text-align:center;font-size:20px;font-weight:800;padding:0 30px;display:none}
</style></head><body>
<header><h1>Бүркітші</h1><span><button id="mute">🔊</button> <span id="st">Қосылуда…</span></span></header>
<div id="pad"><p>Саусақпен жүргіз — нысана қозғалады<br>Бір рет түрт — шүйілу</p><div id="dot"></div></div>
<button id="go">ШҮЙІЛ</button>
<div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
var id=location.hash.slice(1),conn=null,st=document.getElementById('st');
function setSt(t,ok){st.textContent=t;st.className=ok?'ok':''}
function send(o){if(conn&&conn.open)conn.send(o)}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function connect(){
  if(!id){setSt('QR-кодты қайта сканерле');return}
  var peer=new Peer({debug:0});
  peer.on('open',function(){
    conn=peer.connect(id,{reliable:true});
    conn.on('open',function(){setSt('ТВ-ға қосылды',true);buzz(30)});
    conn.on('data',function(d){if(d&&d.t=='v')buzz(d.p);
      if(d&&d.t=='snd')document.getElementById('mute').textContent=d.on?'🔊':'🔇';
      if(d&&d.t=='s'&&d.s=='over')setSt('Ұпай: '+d.score,true);
      if(d&&d.t=='s'&&d.s=='play')setSt('Ойын жүріп жатыр',true)});
    conn.on('close',function(){setSt('Ажырады, қайта қосылуда…');setTimeout(connect,1500)});
  });
  peer.on('error',function(e){setSt(e&&e.type=='peer-unavailable'?'ТВ табылмады — QR-ды қайта сканерле':'Қайта қосылуда…');
    if(!(e&&e.type=='peer-unavailable'))setTimeout(connect,2500)});
}
connect();

/* тачпад */
var pad=document.getElementById('pad'),dot=document.getElementById('dot');
var lx=0,ly=0,sx=0,sy=0,t0=0,moved=0,ax=0,ay=0,raf=0,SENS=1.9;
function flush(){raf=0;if(ax||ay){send({t:'m',x:ax,y:ay});ax=ay=0}}
pad.addEventListener('touchstart',function(e){var t=e.touches[0];lx=sx=t.clientX;ly=sy=t.clientY;t0=Date.now();moved=0;
  dot.style.left=lx-pad.getBoundingClientRect().left+'px';dot.style.top=ly-pad.getBoundingClientRect().top+'px';dot.style.opacity=1;e.preventDefault()},{passive:false});
pad.addEventListener('touchmove',function(e){var t=e.touches[0],r=pad.getBoundingClientRect();
  ax+=(t.clientX-lx)/r.width*SENS;ay+=(t.clientY-ly)/r.height*SENS*1.15;
  moved+=Math.abs(t.clientX-lx)+Math.abs(t.clientY-ly);lx=t.clientX;ly=t.clientY;
  dot.style.left=lx-r.left+'px';dot.style.top=ly-r.top+'px';
  if(!raf)raf=requestAnimationFrame(flush);e.preventDefault()},{passive:false});
pad.addEventListener('touchend',function(e){dot.style.opacity=0;
  if(moved<12&&Date.now()-t0<300){send({t:'a'});buzz(15)}e.preventDefault()},{passive:false});
document.getElementById('mute').addEventListener('click',function(){send({t:'mute'})});
var go=document.getElementById('go');
go.addEventListener('touchstart',function(e){go.className='on';send({t:'a'});buzz(15);e.preventDefault()},{passive:false});
go.addEventListener('touchend',function(){go.className=''});
go.addEventListener('click',function(){send({t:'a'})});
// компьютерден тексеру үшін тышқан
var md=0;pad.addEventListener('mousedown',function(e){md=1;lx=e.clientX;ly=e.clientY});
addEventListener('mouseup',function(){md=0});
pad.addEventListener('mousemove',function(e){if(!md)return;var r=pad.getBoundingClientRect();
  ax+=(e.clientX-lx)/r.width*SENS;ay+=(e.clientY-ly)/r.height*SENS;lx=e.clientX;ly=e.clientY;if(!raf)raf=requestAnimationFrame(flush)});
</script></body></html>
