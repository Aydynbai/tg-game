<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Draw & Guess - Рисуй и Угадывай</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Righteous&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B9D;
            --secondary: #FEC260;
            --accent: #4ECDC4;
            --success: #95E1D3;
            --bg: #FFF8F3;
            --card-bg: #FFFFFF;
            --text-dark: #2D3561;
            --text-light: #6B7AA1;
            --shadow: 0 8px 32px rgba(255, 107, 157, 0.15);
            --shadow-strong: 0 12px 48px rgba(255, 107, 157, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FFF8F3 0%, #FFE8F5 100%);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Декоративные элементы фона */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(78, 205, 196, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(254, 194, 96, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 25s ease-in-out infinite reverse;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-family: 'Righteous', cursive;
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 4px 12px rgba(255, 107, 157, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-strong);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }

        .word-display {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.1) 0%, rgba(254, 194, 96, 0.1) 100%);
            border-radius: 16px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            animation: wordReveal 0.8s ease-out;
        }

        @keyframes wordReveal {
            from {
                opacity: 0;
                transform: scale(0.8) rotateX(90deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotateX(0deg);
            }
        }

        .canvas-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.08);
            background: #FFFFFF;
            margin-bottom: 20px;
        }

        #drawingCanvas {
            display: block;
            width: 100%;
            height: 400px;
            cursor: crosshair;
            touch-action: none;
        }

        .tools {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .color-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .color-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, transparent 70%);
        }

        .color-btn:hover::before {
            opacity: 1;
        }

        .color-btn.active {
            border-color: var(--text-dark);
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .tool-group {
            display: flex;
            gap: 8px;
            flex: 1;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #FF8CB4 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(255, 107, 157, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--accent) 0%, #6FE7DE 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(78, 205, 196, 0.3);
        }

        .btn-outline {
            background: white;
            color: var(--text-dark);
            border: 2px solid var(--primary);
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(255, 107, 157, 0.2);
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }

        .input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.1);
            background: white;
        }

        .guess-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 16px;
        }

        .guess-item {
            padding: 14px 18px;
            margin-bottom: 10px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(149, 225, 211, 0.15) 0%, rgba(78, 205, 196, 0.15) 100%);
            border-left: 4px solid var(--success);
            animation: slideInRight 0.4s ease-out;
            transition: transform 0.2s ease;
        }

        .guess-item:hover {
            transform: translateX(4px);
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .guess-item.correct {
            background: linear-gradient(135deg, rgba(149, 225, 211, 0.3) 0%, rgba(78, 205, 196, 0.3) 100%);
            border-left-color: var(--accent);
            font-weight: 600;
        }

        .guess-user {
            font-weight: 600;
            color: var(--primary);
            margin-right: 8px;
        }

        .drawing-item {
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease-out;
        }

        .drawing-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
        }

        .drawing-preview {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 12px;
            background: #f5f5f5;
        }

        .drawing-word {
            font-weight: 600;
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .drawing-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .nav-tab {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 16px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: var(--text-light);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--primary) 0%, #FF8CB4 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(255, 107, 157, 0.3);
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .slider-container {
            margin: 16px 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-dark);
            font-weight: 500;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.2) 0%, rgba(254, 194, 96, 0.2) 100%);
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 107, 157, 0.4);
            transition: transform 0.2s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 107, 157, 0.4);
            border: none;
        }

        .score {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
            margin: 12px 0;
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }

            .logo {
                font-size: 2rem;
            }

            #drawingCanvas {
                height: 300px;
            }

            .tools {
                gap: 8px;
            }

            .color-btn {
                width: 42px;
                height: 42px;
            }
        }

        /* Loader */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎨 Draw & Guess</div>
            <div class="subtitle">Рисуй и угадывай вместе с друзьями!</div>
        </div>

        <!-- Меню навигации -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showScreen('draw')">✏️ Рисовать</button>
            <button class="nav-tab" onclick="showScreen('guess')">🎯 Угадывать</button>
            <button class="nav-tab" onclick="showScreen('gallery')">🖼️ Галерея</button>
        </div>

        <!-- Экран рисования -->
        <div id="drawScreen" class="screen active">
            <div class="card">
                <div class="word-display" id="currentWord">🎲 Нажмите "Новое слово"</div>
                
                <div class="canvas-container">
                    <canvas id="drawingCanvas"></canvas>
                </div>

                <div class="slider-container">
                    <div class="slider-label">
                        <span>Размер кисти</span>
                        <span id="brushSizeValue">5</span>
                    </div>
                    <input type="range" class="slider" id="brushSize" min="1" max="20" value="5">
                </div>

                <div class="tools">
                    <div class="color-picker">
                        <button class="color-btn active" style="background: #000000;" onclick="selectColor('#000000')"></button>
                        <button class="color-btn" style="background: #FF6B9D;" onclick="selectColor('#FF6B9D')"></button>
                        <button class="color-btn" style="background: #4ECDC4;" onclick="selectColor('#4ECDC4')"></button>
                        <button class="color-btn" style="background: #FEC260;" onclick="selectColor('#FEC260')"></button>
                        <button class="color-btn" style="background: #95E1D3;" onclick="selectColor('#95E1D3')"></button>
                        <button class="color-btn" style="background: #A78BFA;" onclick="selectColor('#A78BFA')"></button>
                        <button class="color-btn" style="background: #F43F5E;" onclick="selectColor('#F43F5E')"></button>
                        <button class="color-btn" style="background: #3B82F6;" onclick="selectColor('#3B82F6')"></button>
                    </div>
                </div>

                <div class="tool-group">
                    <button class="btn btn-outline" onclick="clearCanvas()">🗑️ Очистить</button>
                    <button class="btn btn-secondary" onclick="getNewWord()">🎲 Новое слово</button>
                </div>

                <button class="btn btn-primary" onclick="saveDrawing()" style="width: 100%; margin-top: 12px;">
                    💾 Сохранить рисунок
                </button>
            </div>
        </div>

        <!-- Экран угадывания -->
        <div id="guessScreen" class="screen">
            <div class="card">
                <h2 style="margin-bottom: 16px; text-align: center;">🎯 Угадай рисунок!</h2>
                
                <div class="canvas-container" id="guessCanvasContainer">
                    <canvas id="guessCanvas"></canvas>
                </div>

                <div class="input-group">
                    <input type="text" class="input" id="guessInput" placeholder="Введи своё предположение..." onkeypress="handleGuessEnter(event)">
                </div>

                <button class="btn btn-primary" onclick="submitGuess()" style="width: 100%;">
                    ✅ Отправить
                </button>

                <div class="guess-list" id="guessList"></div>

                <button class="btn btn-secondary" onclick="loadRandomDrawing()" style="width: 100%; margin-top: 16px;">
                    🔄 Следующий рисунок
                </button>
            </div>
        </div>

        <!-- Галерея рисунков -->
        <div id="galleryScreen" class="screen">
            <div class="card">
                <h2 style="margin-bottom: 16px; text-align: center;">🖼️ Галерея рисунков</h2>
                <div id="galleryList"></div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.enableClosingConfirmation();
        }

        // Список слов для рисования
        const words = [
            'Кот', 'Собака', 'Дом', 'Дерево', 'Солнце', 'Машина', 'Цветок', 'Рыба',
            'Птица', 'Звезда', 'Сердце', 'Облако', 'Зонтик', 'Книга', 'Телефон',
            'Очки', 'Чашка', 'Торт', 'Гитара', 'Ракета', 'Бабочка', 'Яблоко',
            'Самолёт', 'Велосипед', 'Шляпа', 'Мороженое', 'Пицца', 'Радуга'
        ];

        // Canvas setup
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const guessCanvas = document.getElementById('guessCanvas');
        const guessCtx = guessCanvas.getContext('2d');

        let isDrawing = false;
        let currentColor = '#000000';
        let currentWord = '';
        let currentDrawingData = null;
        let brushSize = 5;
        let lastX = 0;
        let lastY = 0;

        // Настройка размера canvas
        function resizeCanvas(canvasElement) {
            const container = canvasElement.parentElement;
            const rect = container.getBoundingClientRect();
            canvasElement.width = rect.width;
            canvasElement.height = canvasElement.id === 'drawingCanvas' ? 400 : 400;
            
            if (canvasElement === canvas) {
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }
        }

        resizeCanvas(canvas);
        resizeCanvas(guessCanvas);

        window.addEventListener('resize', () => {
            resizeCanvas(canvas);
            resizeCanvas(guessCanvas);
        });

        // Drawing functions
        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const x = (e.type.includes('mouse') ? e.clientX : e.touches[0].clientX) - rect.left;
            const y = (e.type.includes('mouse') ? e.clientY : e.touches[0].clientY) - rect.top;
            
            lastX = x;
            lastY = y;
            
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const x = (e.type.includes('mouse') ? e.clientX : e.touches[0].clientX) - rect.left;
            const y = (e.type.includes('mouse') ? e.clientY : e.touches[0].clientY) - rect.top;

            ctx.strokeStyle = currentColor;
            ctx.lineWidth = brushSize;
            
            ctx.lineTo(x, y);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        // Event listeners for drawing
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        // Brush size slider
        document.getElementById('brushSize').addEventListener('input', (e) => {
            brushSize = e.target.value;
            document.getElementById('brushSizeValue').textContent = brushSize;
        });

        // Color selection
        function selectColor(color) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // Clear canvas
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Get new word
        function getNewWord() {
            currentWord = words[Math.floor(Math.random() * words.length)];
            document.getElementById('currentWord').textContent = currentWord;
            clearCanvas();
        }

        // Storage functions
        async function saveDrawing() {
            if (!currentWord) {
                alert('Сначала выбери слово для рисования! 🎲');
                return;
            }

            const imageData = canvas.toDataURL('image/png');
            const timestamp = Date.now();
            const drawingId = `drawing_${timestamp}`;

            const drawing = {
                id: drawingId,
                word: currentWord,
                image: imageData,
                timestamp: timestamp,
                guesses: []
            };

            try {
                await window.storage.set(drawingId, JSON.stringify(drawing), true);
                alert('✅ Рисунок сохранён! Теперь другие могут угадать что это!');
                clearCanvas();
                getNewWord();
            } catch (error) {
                console.error('Error saving drawing:', error);
                alert('❌ Ошибка при сохранении. Попробуй ещё раз!');
            }
        }

        // Load random drawing for guessing
        async function loadRandomDrawing() {
            try {
                const keys = await window.storage.list('drawing_', true);
                
                if (!keys || !keys.keys || keys.keys.length === 0) {
                    document.getElementById('guessCanvasContainer').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🎨</div>
                            <p>Пока нет рисунков для угадывания!<br>Нарисуй первый!</p>
                        </div>
                    `;
                    return;
                }

                const randomKey = keys.keys[Math.floor(Math.random() * keys.keys.length)];
                const result = await window.storage.get(randomKey, true);
                
                if (result && result.value) {
                    const drawing = JSON.parse(result.value);
                    currentDrawingData = drawing;
                    
                    const img = new Image();
                    img.onload = () => {
                        guessCtx.clearRect(0, 0, guessCanvas.width, guessCanvas.height);
                        guessCtx.drawImage(img, 0, 0, guessCanvas.width, guessCanvas.height);
                    };
                    img.src = drawing.image;

                    displayGuesses(drawing.guesses);
                }
            } catch (error) {
                console.error('Error loading drawing:', error);
                document.getElementById('guessCanvasContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">😔</div>
                        <p>Не удалось загрузить рисунок</p>
                    </div>
                `;
            }
        }

        // Submit guess
        async function submitGuess() {
            const guessInput = document.getElementById('guessInput');
            const guess = guessInput.value.trim();

            if (!guess) {
                alert('Введи своё предположение! 💭');
                return;
            }

            if (!currentDrawingData) {
                alert('Сначала загрузи рисунок! 🎨');
                return;
            }

            const userName = tg?.initDataUnsafe?.user?.first_name || 'Игрок';
            const isCorrect = guess.toLowerCase() === currentDrawingData.word.toLowerCase();

            const guessObj = {
                user: userName,
                guess: guess,
                correct: isCorrect,
                timestamp: Date.now()
            };

            currentDrawingData.guesses.push(guessObj);

            try {
                await window.storage.set(currentDrawingData.id, JSON.stringify(currentDrawingData), true);
                
                guessInput.value = '';
                displayGuesses(currentDrawingData.guesses);

                if (isCorrect) {
                    alert('🎉 Правильно! Это действительно ' + currentDrawingData.word + '!');
                    setTimeout(() => loadRandomDrawing(), 1500);
                }
            } catch (error) {
                console.error('Error saving guess:', error);
                alert('❌ Ошибка при сохранении. Попробуй ещё раз!');
            }
        }

        function handleGuessEnter(event) {
            if (event.key === 'Enter') {
                submitGuess();
            }
        }

        // Display guesses
        function displayGuesses(guesses) {
            const guessList = document.getElementById('guessList');
            
            if (!guesses || guesses.length === 0) {
                guessList.innerHTML = '<div class="empty-state"><p style="font-size: 0.9rem;">Пока никто не угадывал... Будь первым! 🎯</p></div>';
                return;
            }

            guessList.innerHTML = guesses
                .sort((a, b) => b.timestamp - a.timestamp)
                .map(g => `
                    <div class="guess-item ${g.correct ? 'correct' : ''}">
                        <span class="guess-user">${g.user}:</span>
                        <span>${g.guess}</span>
                        ${g.correct ? ' ✅' : ''}
                    </div>
                `).join('');
        }

        // Load gallery
        async function loadGallery() {
            try {
                const keys = await window.storage.list('drawing_', true);
                const galleryList = document.getElementById('galleryList');

                if (!keys || !keys.keys || keys.keys.length === 0) {
                    galleryList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🖼️</div>
                            <p>Галерея пуста!<br>Создай первый шедевр!</p>
                        </div>
                    `;
                    return;
                }

                const drawings = [];
                for (const key of keys.keys) {
                    try {
                        const result = await window.storage.get(key, true);
                        if (result && result.value) {
                            drawings.push(JSON.parse(result.value));
                        }
                    } catch (e) {
                        console.error('Error loading drawing:', e);
                    }
                }

                drawings.sort((a, b) => b.timestamp - a.timestamp);

                galleryList.innerHTML = drawings.map(d => {
                    const correctGuesses = d.guesses.filter(g => g.correct).length;
                    const totalGuesses = d.guesses.length;
                    const date = new Date(d.timestamp).toLocaleDateString('ru-RU');

                    return `
                        <div class="drawing-item" onclick="viewDrawing('${d.id}')">
                            <img src="${d.image}" alt="${d.word}" class="drawing-preview">
                            <div class="drawing-word">${d.word}</div>
                            <div class="drawing-meta">
                                <span>📅 ${date}</span>
                                <span>🎯 ${correctGuesses}/${totalGuesses} угадали</span>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading gallery:', error);
                document.getElementById('galleryList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">😔</div>
                        <p>Не удалось загрузить галерею</p>
                    </div>
                `;
            }
        }

        // View specific drawing
        async function viewDrawing(drawingId) {
            try {
                const result = await window.storage.get(drawingId, true);
                if (result && result.value) {
                    const drawing = JSON.parse(result.value);
                    currentDrawingData = drawing;
                    
                    const img = new Image();
                    img.onload = () => {
                        guessCtx.clearRect(0, 0, guessCanvas.width, guessCanvas.height);
                        guessCtx.drawImage(img, 0, 0, guessCanvas.width, guessCanvas.height);
                    };
                    img.src = drawing.image;

                    displayGuesses(drawing.guesses);
                    showScreen('guess');
                }
            } catch (error) {
                console.error('Error viewing drawing:', error);
                alert('Не удалось загрузить рисунок 😔');
            }
        }

        // Screen navigation
        function showScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

            if (screenName === 'draw') {
                document.getElementById('drawScreen').classList.add('active');
                document.querySelector('.nav-tab:nth-child(1)').classList.add('active');
            } else if (screenName === 'guess') {
                document.getElementById('guessScreen').classList.add('active');
                document.querySelector('.nav-tab:nth-child(2)').classList.add('active');
                loadRandomDrawing();
            } else if (screenName === 'gallery') {
                document.getElementById('galleryScreen').classList.add('active');
                document.querySelector('.nav-tab:nth-child(3)').classList.add('active');
                loadGallery();
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            getNewWord();
        });
    </script>
</body>
</html>
